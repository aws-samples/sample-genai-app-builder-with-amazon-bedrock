name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup and Build
        uses: ./.github/actions/setup-and-build

      # typecheck/test scripts live in frontend/package.json, not the root.
      - name: Run type check
        working-directory: frontend
        run: pnpm run typecheck

      # - name: Run ESLint
      #   working-directory: frontend
      #   run: pnpm run lint

      - name: Run tests
        working-directory: frontend
        run: pnpm run test
