name: Setup and Build
description: Generic setup action
inputs:
  pnpm-version:
    required: false
    type: string
    default: '9.4.0'
  node-version:
    required: false
    type: string
    default: '20.15.1'

runs:
  using: composite

  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}
        run_install: false

    - name: Set Node.js version to ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    # The build reads infra/config.yml, which is gitignored (environment
    # config is never committed). Seed it from the checked-in example so a
    # clean CI checkout can build.
    - name: Seed build config
      shell: bash
      run: cp infra/config.example.yml infra/config.yml

    - name: Install dependencies and build project
      shell: bash
      run: |
        pnpm install
        cd frontend && pnpm install && cd ..
        pnpm run build
